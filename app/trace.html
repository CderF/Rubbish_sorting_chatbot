<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>回答トレース — ごみ分別チャットボット</title>
<style>
  :root{
    --bg:#f4f6f8; --panel:#ffffff; --border:#dfe4ea; --text:#1a2027;
    --muted:#6b7684; --accent:#1a56b8; --accent-soft:#e8f0fd;
    --ok:#1c8c4a; --warn:#b8860b; --err:#c0392b;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14181d; --panel:#1c2127; --border:#2b323b; --text:#e4e8ed;
      --muted:#8b95a3; --accent:#5a9bf5; --accent-soft:#1e2a3d;
      --ok:#3fbf6f; --warn:#d4a12c; --err:#e05c4b;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
       min-height:100vh}
  header{background:var(--panel);border-bottom:1px solid var(--border);
         padding:12px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
  header h1{margin:0;font-size:15px;font-weight:650}
  header a{color:var(--accent);font-size:13px;text-decoration:none}
  header a:hover{text-decoration:underline}
  .sub{font-size:12px;color:var(--muted);margin-left:auto;display:flex;align-items:center;gap:10px}
  .sub input{width:64px;border:1px solid var(--border);border-radius:6px;padding:3px 6px;
             background:var(--bg);color:var(--text);font:inherit}
  .sub button{border:1px solid var(--border);background:var(--bg);color:var(--text);
              border-radius:6px;padding:3px 10px;cursor:pointer;font:inherit}
  .sub button:hover{border-color:var(--accent);color:var(--accent)}
  main{padding:16px 20px;max-width:1200px;margin:0 auto}
  .path{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted);
        margin-bottom:12px;word-break:break-all}
  .empty{color:var(--muted);font-size:13px;line-height:2;padding:40px 0;text-align:center}

  .row{background:var(--panel);border:1px solid var(--border);border-radius:10px;
       margin-bottom:10px;padding:12px 14px}
  .row .q{font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word;margin-bottom:8px}
  .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:11.5px}
  .chip{padding:2px 8px;border-radius:10px;background:var(--bg);border:1px solid var(--border);
        color:var(--muted);white-space:nowrap}
  .chip b{color:var(--text);font-weight:600}
  .chip.stage-exact{background:rgba(28,140,74,.15);color:var(--ok);border-color:transparent}
  .chip.stage-partial{background:var(--accent-soft);color:var(--accent);border-color:transparent}
  .chip.stage-vector,.chip.stage-analogy{background:rgba(184,134,11,.16);color:var(--warn);border-color:transparent}
  .chip.gate{background:rgba(192,57,43,.14);color:var(--err);border-color:transparent;font-weight:600}
  .chip.flag{background:rgba(184,134,11,.16);color:var(--warn);border-color:transparent}
  .row .det{margin-top:9px;border-top:1px solid var(--border);padding-top:9px;font-size:12.5px;
            display:none}
  .row.open .det{display:block}
  .row .toggle{font-size:11.5px;color:var(--accent);cursor:pointer;user-select:none;margin-top:8px;
               display:inline-block}
  .det .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;
          margin:8px 0 3px;font-weight:650}
  .det .a{white-space:pre-wrap;word-break:break-word;line-height:1.65}
  .det ul{margin:3px 0;padding-left:18px}
  .det li{margin:1px 0;word-break:break-all}
  .det a{color:var(--accent)}
</style>
</head>
<body>

<header>
  <h1>回答トレース</h1>
  <a href="/">← チャットに戻る</a>
  <div class="sub">
    <label>直近 <input type="number" id="limit" value="100" min="1" max="500"> 件</label>
    <button id="reload">更新</button>
  </div>
</header>

<main>
  <div class="path" id="path"></div>
  <div id="list"><div class="empty">読み込み中…</div></div>
</main>

<script>
const $ = id => document.getElementById(id);

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function chip(label, value, cls){
  const v = (value === null || value === undefined || value === '') ? '—' : value;
  return '<span class="chip ' + (cls || '') + '"><b>' + escapeHtml(label) + '</b> '
       + escapeHtml(v) + '</span>';
}

function urlList(urls){
  if (!urls || !urls.length) return '<div class="a">—</div>';
  return '<ul>' + urls.map(u =>
    '<li><a href="' + escapeHtml(u) + '" target="_blank" rel="noopener noreferrer">'
    + escapeHtml(u) + '</a></li>').join('') + '</ul>';
}

function renderRow(r){
  const el = document.createElement('div');
  el.className = 'row';

  const region = [r.ward, r.town].filter(Boolean).join('') || null;
  const stageCls = r.match_stage ? 'stage-' + r.match_stage : '';

  const meta = [
    chip('セッション', r.session_id ? String(r.session_id).slice(0, 16) : null),
    chip('地区', region),
    chip('品目', r.item),
    chip('検索段', r.match_stage_label, stageCls),
    chip('早見表ヒット', (r.item_hit_names || []).length),
    chip('収集日ヒット', r.schedule_hits),
  ];
  if (r.safety_gate) meta.push('<span class="chip gate">安全ゲート ' + escapeHtml(r.safety_gate_label || r.safety_gate) + '</span>');
  else if (r.canned_response) meta.push('<span class="chip flag">固定回答</span>');
  if (r.timeline_change) meta.push('<span class="chip flag">4-2 変更予定</span>');
  if (r.analogy) meta.push('<span class="chip flag">4-3 ' + (r.analogy_unreliable ? '類推(確度不足)' : '類推') + '</span>');
  (r.missing || []).forEach(m => meta.push(chip('不足', m)));

  el.innerHTML =
    '<div class="q">' + escapeHtml(r.prompt || '(空)') + '</div>'
    + '<div class="meta">' + meta.join('') + '</div>'
    + '<span class="toggle">詳細 ▾</span>'
    + '<div class="det">'
      + '<div class="k">品名候補</div><div class="a">'
        + escapeHtml((r.item_candidates || []).join(' / ') || '—') + '</div>'
      + '<div class="k">早見表ヒット名</div><div class="a">'
        + escapeHtml((r.item_hit_names || []).join(' / ') || '—') + '</div>'
      + (r.timeline_item_name ? '<div class="k">時間軸の品目</div><div class="a">'
        + escapeHtml(r.timeline_item_name) + '</div>' : '')
      + '<div class="k">採用した根拠URL</div>' + urlList(r.sources)
      + '<div class="k">最終回答</div><div class="a">'
        + escapeHtml(r.final_response || '—') + '</div>'
    + '</div>';

  el.querySelector('.toggle').onclick = () => {
    el.classList.toggle('open');
    el.querySelector('.toggle').textContent = el.classList.contains('open') ? '詳細 ▴' : '詳細 ▾';
  };
  return el;
}

async function load(){
  const limit = Math.max(1, Math.min(500, parseInt($('limit').value, 10) || 100));
  $('list').innerHTML = '<div class="empty">読み込み中…</div>';
  try{
    const res = await fetch('/trace/data?limit=' + limit);
    if (res.status === 401){ location.href = '/login'; return; }
    const d = await res.json();
    $('path').textContent = 'ソース: ' + (d.path || '-') + (d.enabled ? '' : '  (トレース記録は無効)');
    if (!d.rows || !d.rows.length){
      $('list').innerHTML = '<div class="empty">トレースがまだありません。'
        + 'チャットで質問すると1件ずつ記録されます。</div>';
      return;
    }
    const frag = document.createDocumentFragment();
    d.rows.forEach(r => frag.appendChild(renderRow(r)));
    $('list').innerHTML = '';
    $('list').appendChild(frag);
  }catch(e){
    $('list').innerHTML = '<div class="empty">取得に失敗しました: ' + escapeHtml(e.message) + '</div>';
  }
}

$('reload').onclick = load;
$('limit').addEventListener('keydown', e => { if (e.key === 'Enter') load(); });
load();
</script>
</body>
</html>
