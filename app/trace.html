<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>回答トレース — ごみ分別チャットボット</title>
<style>
  :root{
    --bg:#f4f6f8; --panel:#ffffff; --border:#dfe4ea; --text:#1a2027;
    --muted:#6b7684; --accent:#1a56b8; --accent-soft:#e8f0fd;
    --ok:#1c8c4a; --warn:#b8860b; --err:#c0392b;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14181d; --panel:#1c2127; --border:#2b323b; --text:#e4e8ed;
      --muted:#8b95a3; --accent:#5a9bf5; --accent-soft:#1e2a3d;
      --ok:#3fbf6f; --warn:#d4a12c; --err:#e05c4b;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
       min-height:100vh}
  header{background:var(--panel);border-bottom:1px solid var(--border);
         padding:12px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
  header h1{margin:0;font-size:15px;font-weight:650}
  header a{color:var(--accent);font-size:13px;text-decoration:none}
  header a:hover{text-decoration:underline}
  .sub{font-size:12px;color:var(--muted);margin-left:auto;display:flex;align-items:center;gap:10px}
  .sub input{width:64px;border:1px solid var(--border);border-radius:6px;padding:3px 6px;
             background:var(--bg);color:var(--text);font:inherit}
  .sub button{border:1px solid var(--border);background:var(--bg);color:var(--text);
              border-radius:6px;padding:3px 10px;cursor:pointer;font:inherit}
  .sub button:hover{border-color:var(--accent);color:var(--accent)}
  main{padding:16px 20px;max-width:1200px;margin:0 auto}
  .path{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted);
        margin-bottom:12px;word-break:break-all}
  .empty{color:var(--muted);font-size:13px;line-height:2;padding:40px 0;text-align:center}

  .row{background:var(--panel);border:1px solid var(--border);border-radius:10px;
       margin-bottom:10px;padding:12px 14px}
  .row .q{font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word;margin-bottom:8px}
  .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:11.5px}
  .chip{padding:2px 8px;border-radius:10px;background:var(--bg);border:1px solid var(--border);
        color:var(--muted);white-space:nowrap}
  .chip b{color:var(--text);font-weight:600}
  .chip.stage-exact{background:rgba(28,140,74,.15);color:var(--ok);border-color:transparent}
  .chip.stage-partial{background:var(--accent-soft);color:var(--accent);border-color:transparent}
  .chip.stage-vector,.chip.stage-analogy{background:rgba(184,134,11,.16);color:var(--warn);border-color:transparent}
  .chip.gate{background:rgba(192,57,43,.14);color:var(--err);border-color:transparent;font-weight:600}
  .chip.flag{background:rgba(184,134,11,.16);color:var(--warn);border-color:transparent}
  .row .det{margin-top:9px;border-top:1px solid var(--border);padding-top:9px;font-size:12.5px;
            display:none}
  .row.open .det{display:block}
  .row .toggle{font-size:11.5px;color:var(--accent);cursor:pointer;user-select:none;margin-top:8px;
               display:inline-block}
  .det .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;
          margin:8px 0 3px;font-weight:650}
  .det .a{white-space:pre-wrap;word-break:break-word;line-height:1.65}
  .det ul{margin:3px 0;padding-left:18px}
  .det li{margin:1px 0;word-break:break-all}
  .det a{color:var(--accent)}

  .trail{border:1px solid var(--border);border-radius:8px;margin:4px 0 8px;overflow:hidden}
  .trail .call{padding:7px 10px;border-top:1px solid var(--border)}
  .trail .call:first-child{border-top:none}
  .trail .call .cq{font-size:11.5px;color:var(--muted);margin-bottom:5px}
  .trail .call .cq b{color:var(--text);font-weight:600}
  .trail .rej{color:var(--err);font-size:11px;margin-left:6px}
  .round-h{padding:4px 10px 0;font-size:10.5px;font-weight:650;color:var(--accent);
           text-transform:uppercase;letter-spacing:.4px}
  .attempt{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:11.5px}
  .attempt .stage{flex:0 0 auto;min-width:112px;color:var(--muted)}
  .attempt .stage b{color:var(--text);font-weight:600;display:block;font-size:11.5px}
  .attempt .hits{flex:1;display:flex;flex-wrap:wrap;gap:4px}
  .hitpill{padding:1px 7px;border-radius:9px;background:var(--bg);border:1px solid var(--border);
           font-size:11px;white-space:nowrap}
  .hitpill.picked{background:rgba(28,140,74,.15);border-color:transparent;color:var(--ok);font-weight:600}
  .hitpill .rs{opacity:.75;margin-left:3px}
  .rs2{color:var(--ok)}.rs1{color:var(--warn)}.rs0{color:var(--err)}
  .noattempt{color:var(--muted);font-size:11px}

  .cmp{border:1px solid var(--border);border-radius:8px;padding:8px 10px 2px;margin:6px 0 10px;
       background:var(--bg)}
  .cmp .note{color:var(--muted);font-size:11px;margin-bottom:2px}
  .cmp .k{margin-top:8px}
</style>
</head>
<body>

<header>
  <h1>回答トレース</h1>
  <a href="/">← チャットに戻る</a>
  <div class="sub">
    <label>直近 <input type="number" id="limit" value="100" min="1" max="500"> 件</label>
    <button id="reload">更新</button>
  </div>
</header>

<main>
  <div class="path" id="path"></div>
  <div id="list"><div class="empty">読み込み中…</div></div>
</main>

<script>
const $ = id => document.getElementById(id);

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function chip(label, value, cls){
  const v = (value === null || value === undefined || value === '') ? '—' : value;
  return '<span class="chip ' + (cls || '') + '"><b>' + escapeHtml(label) + '</b> '
       + escapeHtml(v) + '</span>';
}

const STAGE_LABELS = {
  canonical_alias: '別名表(完全一致)',
  exact: '完全一致',
  partial: '部分一致',
  embedded: '埋め込み品名',
  alias_embedded: '別名表(埋め込み)',
  vector: 'ベクトル類似(品目库)',
  vector_skipped: 'ベクトル検索スキップ',
  vector_explanations: 'ベクトル類似(説明ページ库)',
  change_notice_lookup: '変更予定の確認',
};
const TOOL_LABELS = {
  search_waste_item: '品目検索',
  search_general_info: '一般説明検索',
  lookup_item_change_notice: '変更予定の確認',
};
const STOP_REASON_LABELS = {
  model_stopped: 'モデル自身が打ち切り(追加確認なし)',
  max_rounds_reached: 'ラウンド上限到達',
};
const RS_LABELS = {2: '上位語', 1: '弱い関連', 0: '無関連'};
// この stage が実際に向量库(Chroma)へ1回問い合わせた印。「N回打った」を
// 数えるときはこれだけをカウントする(vector_skipped は打っていない)。
const VECTOR_STAGES = new Set(['vector', 'vector_explanations']);

function countVectorHits(searchTrail){
  let n = 0;
  (searchTrail || []).forEach(call =>
    (call.attempts || []).forEach(a => { if (VECTOR_STAGES.has(a.stage)) n++; }));
  return n;
}

function hitPill(hit, pickedNames){
  if (typeof hit === 'string') hit = {item_name: hit};
  if (hit.title !== undefined){
    // 説明ページのチャンク(search_general_info)。品名候補とは形が違う
    // ―本文に種別名が含まれていたか(grounded)で採用/却下を示す。
    const scoreTxt = (hit.score === undefined || hit.score === null)
      ? '' : '<span class="rs">(score ' + Number(hit.score).toFixed(3) + ')</span>';
    return '<span class="hitpill' + (hit.grounded ? ' picked' : '') + '">'
         + escapeHtml(hit.title || '(無題)') + ' ' + scoreTxt + '</span>';
  }
  const name = hit.item_name || '';
  const picked = pickedNames.has(name);
  let rs = '';
  if (hit.relation_strength !== undefined && hit.relation_strength !== null){
    rs = '<span class="rs rs' + hit.relation_strength + '">('
       + (RS_LABELS[hit.relation_strength] ?? hit.relation_strength) + ')</span>';
  }
  const dm = hit.disposal_method ? ' → ' + escapeHtml(hit.disposal_method) : '';
  return '<span class="hitpill' + (picked ? ' picked' : '') + '">'
       + escapeHtml(name) + dm + rs + '</span>';
}

function renderTrail(searchTrail, pickedNames){
  if (!searchTrail || !searchTrail.length) return '';

  // Agentic経路はラウンドごとに検索するので、ラウンド単位でグルーピング
  // して表示する ― 「ラウンド1で見つけた候補をそのまま、ラウンド2以降で
  // 確認せず終わっている」ような流れを時系列で追えるようにするため。
  // round が無い(決定論的経路)場合は1グループにまとめる。
  const groups = new Map();
  searchTrail.forEach(call => {
    const key = call.round || 0;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(call);
  });

  const body = [...groups.entries()].sort((a, b) => a[0] - b[0]).map(([round, calls]) => {
    const header = round ? '<div class="round-h">ラウンド ' + round + '</div>' : '';
    const callsHtml = calls.map(call => {
      const attempts = (call.attempts || []).map(a => {
        const hits = (a.hits || []).length
          ? (a.hits || []).map(h => hitPill(h, pickedNames)).join('')
          : '<span class="noattempt">空振り</span>';
        return '<div class="attempt"><div class="stage"><b>'
          + escapeHtml(STAGE_LABELS[a.stage] || a.stage) + '</b>'
          + escapeHtml(a.query || '') + '</div><div class="hits">' + hits + '</div></div>';
      }).join('');
      const rej = call.rejected_reason
        ? '<span class="rej">却下: ' + escapeHtml(call.rejected_reason) + '</span>' : '';
      const toolLabel = TOOL_LABELS[call.tool] ? '[' + TOOL_LABELS[call.tool] + '] ' : '';
      return '<div class="call"><div class="cq">' + toolLabel + '<b>'
        + escapeHtml(call.query || '(空)') + '</b>' + rej + '</div>'
        + (attempts || '<div class="noattempt">試行記録なし</div>') + '</div>';
    }).join('');
    return header + callsHtml;
  }).join('');

  return '<div class="k">検索の過程(採用/却下した候補)</div><div class="trail">' + body + '</div>';
}

function urlList(urls){
  if (!urls || !urls.length) return '<div class="a">—</div>';
  return '<ul>' + urls.map(u =>
    '<li><a href="' + escapeHtml(u) + '" target="_blank" rel="noopener noreferrer">'
    + escapeHtml(u) + '</a></li>').join('') + '</ul>';
}

function renderRow(r){
  const el = document.createElement('div');
  el.className = 'row';

  const region = [r.ward, r.town].filter(Boolean).join('') || null;
  const stageCls = r.match_stage ? 'stage-' + r.match_stage : '';

  const meta = [
    chip('セッション', r.session_id ? String(r.session_id).slice(0, 16) : null),
    chip('地区', region),
    chip('品目', r.item),
    chip('検索段', r.match_stage_label, stageCls),
    chip('早見表ヒット', (r.item_hit_names || []).length),
    chip('収集日ヒット', r.schedule_hits),
  ];
  if (r.search_trail && r.search_trail.length){
    meta.push(chip('ベクトル検索', countVectorHits(r.search_trail) + '回'));
  }
  if (r.agent_rounds){
    meta.push(chip('検索ラウンド', r.agent_rounds + '回・'
      + (STOP_REASON_LABELS[r.agent_stop_reason] || r.agent_stop_reason)));
  }
  if (r.safety_gate) meta.push('<span class="chip gate">安全ゲート ' + escapeHtml(r.safety_gate_label || r.safety_gate) + '</span>');
  else if (r.canned_response) meta.push('<span class="chip flag">固定回答</span>');
  if (r.timeline_change) meta.push('<span class="chip flag">4-2 変更予定</span>');
  if (r.analogy) meta.push('<span class="chip flag">4-3 ' + (r.analogy_unreliable ? '類推(確度不足)' : '類推') + '</span>');
  (r.missing || []).forEach(m => meta.push(chip('不足', m)));

  const pickedNames = new Set(r.item_hit_names || []);

  el.innerHTML =
    '<div class="q">' + escapeHtml(r.prompt || '(空)') + '</div>'
    + '<div class="meta">' + meta.join('') + '</div>'
    + '<span class="toggle">詳細 ▾</span>'
    + '<div class="det">'
      + '<div class="k">品名候補</div><div class="a">'
        + escapeHtml((r.item_candidates || []).join(' / ') || '—') + '</div>'
      + '<div class="k">早見表ヒット名</div><div class="a">'
        + escapeHtml((r.item_hit_names || []).join(' / ') || '—') + '</div>'
      + renderTrail(r.search_trail, pickedNames)
      + (r.timeline_item_name ? '<div class="k">時間軸の品目</div><div class="a">'
        + escapeHtml(r.timeline_item_name) + '</div>' : '')
      + '<div class="k">採用した根拠URL</div>' + urlList(r.sources)
      + '<div class="cmp">'
        + '<div class="note">' + (r.canned_response
          ? '固定回答/テンプレート回答のため生成(LLM)は経由していない。参考情報。'
          : 'この context を根拠に LLM が下の回答を生成した ― 内容が一致しているか比較する'
          + '(一致していないのに回答がずれているなら生成側、context 自体が空・的外れなら検索側の問題)。')
        + '</div>'
        + '<div class="k">LLMに渡した context(検索結果)</div><div class="a">'
          + escapeHtml(r.context || '(空 ― 根拠なし)') + '</div>'
        + '<div class="k">最終回答</div><div class="a">'
          + escapeHtml(r.final_response || '—') + '</div>'
      + '</div>'
    + '</div>';

  el.querySelector('.toggle').onclick = () => {
    el.classList.toggle('open');
    el.querySelector('.toggle').textContent = el.classList.contains('open') ? '詳細 ▴' : '詳細 ▾';
  };
  return el;
}

async function load(){
  const limit = Math.max(1, Math.min(500, parseInt($('limit').value, 10) || 100));
  $('list').innerHTML = '<div class="empty">読み込み中…</div>';
  try{
    const res = await fetch('/trace/data?limit=' + limit);
    if (res.status === 401){ location.href = '/login'; return; }
    const d = await res.json();
    $('path').textContent = 'ソース: ' + (d.path || '-') + (d.enabled ? '' : '  (トレース記録は無効)');
    if (!d.rows || !d.rows.length){
      $('list').innerHTML = '<div class="empty">トレースがまだありません。'
        + 'チャットで質問すると1件ずつ記録されます。</div>';
      return;
    }
    const frag = document.createDocumentFragment();
    d.rows.forEach(r => frag.appendChild(renderRow(r)));
    $('list').innerHTML = '';
    $('list').appendChild(frag);
  }catch(e){
    $('list').innerHTML = '<div class="empty">取得に失敗しました: ' + escapeHtml(e.message) + '</div>';
  }
}

$('reload').onclick = load;
$('limit').addEventListener('keydown', e => { if (e.key === 'Enter') load(); });
load();
</script>
</body>
</html>
